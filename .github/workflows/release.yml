name: Generate Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package Release Build
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode 16.1 Version
        run: |
          XCODE_PATH="/Applications/Xcode_16.1.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 16.1 not found at $XCODE_PATH, falling back to default Xcode."
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          
          # Restart CoreSimulator service to match the newly selected Xcode developer directory
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

      - name: Install Ruby Dependencies
        run: |
          bundle install --path vendor/bundle

      - name: Build Simulator App via Fastlane
        run: |
          bundle exec fastlane build_simulator

      - name: Package Simulator App Bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../brew_sixty_simulator.zip brew_sixty.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: brew_sixty_simulator.zip
          draft: true
          prerelease: false
          name: Release ${{ github.ref_name || 'manual' }}
          body: |
            ## Release ${{ github.ref_name || 'manual' }}
            
            Attached is the compiled app bundle for the iOS Simulator.
            
            ### How to Install on Simulator:
            1. Download `brew_sixty_simulator.zip` and extract it.
            2. Open your iOS Simulator.
            3. Drag and drop `brew_sixty.app` directly onto the Simulator screen to install it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
