name: CI Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Select Latest Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Boot Simulator & Run Tests
        run: |
          # 1. Wake up simctl to register all default simulator templates
          echo "=== Available Simulators ==="
          xcrun simctl list devices
          
          # 2. Find the first available iOS simulator name
          DEVICE_NAME=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | head -n 1 | sed -E 's/^[[:space:]]*([^()]+(\([^()]+\))?).*/\1/' | sed -E 's/[[:space:]]+$//')
          
          if [ -z "$DEVICE_NAME" ]; then
            DEVICE_NAME="iPhone 16"
          fi
          
          echo "Selected Simulator Device: $DEVICE_NAME"
          
          # 3. Boot the simulator to ensure xcodebuild detects it as active
          xcrun simctl boot "$DEVICE_NAME" || true
          
          # 4. Run the test suite
          xcodebuild test \
            -project brew_sixty.xcodeproj \
            -scheme brew_sixty \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO
