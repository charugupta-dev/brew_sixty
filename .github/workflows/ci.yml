name: CI Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Xcode 16.1 Version
        run: |
          XCODE_PATH="/Applications/Xcode_16.1.app"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "Xcode 16.1 not found at $XCODE_PATH, falling back to default Xcode."
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          
          # Restart CoreSimulator service to match the newly selected Xcode developer directory
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

      - name: Diagnostics - Simulator Runtimes
        run: |
          echo "=== Available Simulator Runtimes (Detailed) ==="
          xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in data.get('runtimes', []):
              print(f\"Runtime: {r.get('name')} | ID: {r.get('identifier')} | Available: {r.get('isAvailable')} | Error: {r.get('availabilityError', 'None')}\")
          "
          
          echo "=== Available iOS Devices in simctl ==="
          xcrun simctl list devices -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for rt, devs in data.get('devices', {}).items():
              if 'iOS' in rt:
                  print(f\"Runtime Group: {rt}\")
                  for d in devs:
                      print(f\"  Device: {d.get('name')} | Available: {d.get('isAvailable')} | State: {d.get('state')}\")
          "

      - name: Boot Simulator & Run Tests
        run: |
          # 1. Update the deployment target in the project file to 17.0 so Xcode matches the simulator destinations
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 26.4;/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/g' brew_sixty.xcodeproj/project.pbxproj
          
          # 2. Detect the first truly available iOS simulator name and version using the CoreSimulator JSON
          RESULT=$(xcrun simctl list -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtime_versions = {}
          for runtime in data.get('runtimes', []):
              is_available = runtime.get('isAvailable', False)
              if is_available or runtime.get('availability', '') == '(available)':
                  runtime_versions[runtime['identifier']] = runtime['version']
          for runtime_id, devices in data.get('devices', {}).items():
              version = runtime_versions.get(runtime_id)
              if version:
                  for device in devices:
                      device_available = device.get('isAvailable', False)
                      if device_available and 'iPhone' in device.get('name', ''):
                          print(f\"{device['name']}|{version}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          
          DEVICE_NAME="${RESULT%|*}"
          OS_VERSION="${RESULT#*|}"
          
          echo "Selected Simulator Device: $DEVICE_NAME"
          echo "Selected OS Version: $OS_VERSION"
          
          # 3. Boot the simulator to ensure xcodebuild detects it as active
          xcrun simctl boot "$DEVICE_NAME" || true
          
          # 4. Run the test suite, targeting only the unit tests (brew_sixtyTests) to bypass slow, flaky UI tests
          xcodebuild test \
            -project brew_sixty.xcodeproj \
            -scheme brew_sixty \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME,OS=$OS_VERSION" \
            -only-testing:brew_sixtyTests \
            CODE_SIGNING_ALLOWED=NO
