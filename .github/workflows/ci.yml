name: CI Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: List Installed Xcode Versions
        run: |
          echo "=== Installed Xcode Applications ==="
          ls -la /Applications | grep -i Xcode || true

      - name: Auto-Select Working Xcode 16
        run: |
          # Find all Xcode 16 versions in descending order
          XCODE_PATHS=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -rV)
          
          SELECTED_PATH=""
          for path in $XCODE_PATHS; do
            echo "Testing Xcode path: $path"
            sudo xcode-select -s "$path/Contents/Developer"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
            
            # Query if this Xcode version has any available iOS simulator runtimes
            HAS_RUNTIMES=$(xcrun simctl list runtimes -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for runtime in data.get('runtimes', []):
                is_available = runtime.get('isAvailable', False)
                if (is_available or runtime.get('availability', '') == '(available)') and 'iOS' in runtime.get('name', ''):
                    sys.exit(0)
            sys.exit(1)
            " && echo "YES" || echo "NO")
            
            if [ "$HAS_RUNTIMES" = "YES" ]; then
              echo "Found active iOS Simulator runtimes using Xcode at $path!"
              SELECTED_PATH="$path"
              break
            else
              echo "No active iOS Simulator runtimes found under Xcode at $path."
            fi
          done
          
          # Fallback if no matching Xcode 16 with runtimes was found
          if [ -z "$SELECTED_PATH" ]; then
            echo "Warning: No Xcode 16 with active iOS Simulator runtimes was found. Falling back to default Xcode."
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
          fi

      - name: Boot Simulator & Run Tests
        run: |
          # 1. Detect the first truly available iOS simulator name and version using the CoreSimulator JSON
          RESULT=$(xcrun simctl list -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtime_versions = {}
          for runtime in data.get('runtimes', []):
              is_available = runtime.get('isAvailable', False)
              if is_available or runtime.get('availability', '') == '(available)':
                  runtime_versions[runtime['identifier']] = runtime['version']
          for runtime_id, devices in data.get('devices', {}).items():
              version = runtime_versions.get(runtime_id)
              if version:
                  for device in devices:
                      device_available = device.get('isAvailable', False)
                      if device_available and 'iPhone' in device.get('name', ''):
                          print(f\"{device['name']}|{version}\")
                          sys.exit(0)
          sys.exit(1)
          ")
          
          DEVICE_NAME="${RESULT%|*}"
          OS_VERSION="${RESULT#*|}"
          
          echo "Selected Simulator Device: $DEVICE_NAME"
          echo "Selected OS Version: $OS_VERSION"
          
          # 2. Boot the simulator to ensure xcodebuild detects it as active
          xcrun simctl boot "$DEVICE_NAME" || true
          
          # 3. Run the test suite
          xcodebuild test \
            -project brew_sixty.xcodeproj \
            -scheme brew_sixty \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME,OS=$OS_VERSION" \
            CODE_SIGNING_ALLOWED=NO
