name: CI Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Select Latest Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          
          # Restart CoreSimulator service to match the newly selected Xcode developer directory
          sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true

      - name: Boot Simulator & Run Tests
        run: |
          # 1. Detect the first truly available iOS simulator name using the CoreSimulator JSON
          DEVICE_NAME=$(xcrun simctl list -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' in runtime:
                  for device in devices:
                      if device.get('isAvailable', False):
                          print(device['name'])
                          sys.exit(0)
          sys.exit(1)
          ")
          
          echo "Selected Simulator Device: $DEVICE_NAME"
          
          # 2. Boot the simulator to ensure xcodebuild detects it as active
          xcrun simctl boot "$DEVICE_NAME" || true
          
          # 3. Run the test suite
          xcodebuild test \
            -project brew_sixty.xcodeproj \
            -scheme brew_sixty \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO
